<!--
modal dialogue box containing the Add Tenant form
-->
<dialog id="edit_tenant_modal" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">Editing!</h3>
    <form 
          {% comment %} hx-post="{% url 'editTenant' tenant.pk %}" {% endcomment %}
          hx-target="#the-table"
          hx-swap="outerHTML"
          hx-on:tenant-added="edit_tenant_modal.close(); this.reset();"
          id="edit-form"
          class="MyForm">
      {% csrf_token %}
      <div class="form-control w-full max-w-xs">
        <label class="label">
          <span class="label-text">Name</span>
        </label>
        {{ form.first_name }}
        {% if form.first_name.errors %}<label class="label text-error">{{ form.first_name.errors }}</label>{% endif %}
      </div>
      <div class="form-control w-full max-w-xs">
        <label class="label">
          <span class="label-text">Last Name</span>
        </label>
        {{ form.last_name }}
        {% if form.last_name.errors %}<label class="label text-error">{{ form.last_name.errors }}</label>{% endif %}
      </div>
      <div class="form-control w-full max-w-xs">
        <label class="label">
          <span class="label-text">Email</span>
        </label>
        {{ form.email }}
        {% if form.email.errors %}<label class="label text-error">{{ form.email.errors }}</label>{% endif %}
      </div>
      <div class="form-control w-full max-w-xs">
        <label class="label">
          <span class="label-text">Phone</span>
        </label>
        {{ form.phone }}
        {% if form.phone.errors %}<label class="label text-error">{{ form.phone.errors }}</label>{% endif %}
      </div>
      <div class="modal-action">
        <button type="button" class="btn" onclick="edit_tenant_modal.close()">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Tenant</button>
      </div>
    </form>
  </div>
</dialog>
